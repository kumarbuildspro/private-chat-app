<!DOCTYPE html>
<html lang="hi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Chat Application</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Auth / Login Screen -->
    <div id="auth-screen" class="glass-card">
        <div class="auth-header">
            <h2>Private Chat Join</h2>
            <button type="button" class="theme-toggle-btn" id="theme-toggle-login" title="Switch Theme">🌙</button>
        </div>
        <p class="subtitle">Bina sahi Room Code aur Passkey ke koi room mein nahi aa sakta.</p>
        
        <form id="login-form">
            <div class="input-group">
                <label>Aapka Naam</label>
                <input type="text" id="username" placeholder="Jaise: Kumar" required />
            </div>

            <div class="input-group">
                <label>Room Code / Name</label>
                <input type="text" id="room-name" placeholder="Jaise: secure-room-1" required />
            </div>

            <div class="input-group">
                <label>Secret Passkey (Dono log same daalein)</label>
                <input type="password" id="room-key" placeholder="••••••••" required />
            </div>

            <button type="submit" id="join-btn">Private Chat Start Karein</button>
            <p id="error-msg" class="error"></p>
        </form>
    </div>

    <!-- Chat Interface -->
    <div id="chat-screen" class="glass-card hidden">
        <header class="chat-header">
            <div>
                <h3 id="current-room-title">Room Name</h3>
                <span class="status-indicator">● Encrypted Private Session</span>
                <div id="active-users-list" class="active-users">Members: -</div>
            </div>
            <div class="header-actions">
                <button type="button" class="theme-toggle-btn" id="theme-toggle-chat" title="Switch Theme">🌙</button>
                <button type="button" id="clear-chat-btn" title="Clear Chat Screen">Clear Chat</button>
                <button type="button" id="leave-btn">Leave</button>
            </div>
        </header>

        <div id="messages-container" class="messages-container"></div>
        <div id="typing-indicator" class="typing-indicator hidden"></div>

        <form id="chat-form" class="chat-input-area">
            <div class="emoji-wrapper">
                <button type="button" id="emoji-btn" class="icon-btn" title="Add Emoji">😊</button>
                <div id="emoji-picker" class="emoji-picker hidden">
                    <span>😀</span><span>😂</span><span>😍</span><span>🔥</span><span>👍</span>
                    <span>🎉</span><span>❤️</span><span>😎</span><span>🙌</span><span>💯</span>
                    <span>🙏</span><span>✨</span><span>🚀</span><span>👏</span><span>💡</span>
                </div>
            </div>

            <label for="image-input" class="icon-btn image-label" title="Upload Image">📷</label>
            <input type="file" id="image-input" accept="image/*" class="hidden" />

            <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" />
            <button type="submit" id="send-btn">Send</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
